[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "med-stock"
version = "0.1.0"
description = "Rural clinic essential medicines (WHO EML) stockout early-warning, FEFO expiry-waste minimizer, safety-stock ROP calculator, and district inter-clinic redistribution planner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "healthcare",
    "supply-chain",
    "essential-medicines",
    "stockout",
    "fefo",
    "inventory",
    "public-health",
    "africa",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
med-stock = "med_stock.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/med-stock"
Repository = "https://github.com/codesphere-u/med-stock"
Issues = "https://github.com/codesphere-u/med-stock/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/med_stock"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["med_stock"]
